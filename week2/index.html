<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madrid or Barcelona?</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 26px;
      color: #222;
    }

    input {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      width: 200px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      background-color: black;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #333;
    }

    #message {
      margin-top: 20px;
      font-weight: 600;
      color: #222;
    }

    #teamLogo {
      margin-top: 30px;
      width: 180px;
      height: auto;
      display: none;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>

  <h1>Are you Madrid or Barcelona?</h1>
  <div>
    <input type="text" id="teamInput" placeholder="Enter team name">
    <button onclick="checkTeam()">Check Team</button>
  </div>
  <p id="message">Please enter 'Madrid' or 'Barcelona'.</p>
  <img id="teamLogo" alt="Team Logo">

  <script>
    function checkTeam() {
      const input = document.getElementById("teamInput").value.trim().toLowerCase();
      const message = document.getElementById("message");
      const logo = document.getElementById("teamLogo");

      if (input === "madrid" || input === "real madrid") {
        message.textContent = "You are a Real Madrid fan! ⚽👑";
        logo.src = "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg";
        logo.style.display = "block";
      } 
      else if (input === "barcelona" || input === "fc barcelona") {
        message.textContent = "You are a Barcelona fan! 💙❤️";
        logo.src = "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg";
        logo.style.display = "block";
      } 
      else {
        message.textContent = "Please enter 'Madrid' or 'Barcelona'.";
        logo.style.display = "none";
      }
    }
  </script>

</body>
</html>
